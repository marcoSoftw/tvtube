<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarcoSoft - Reproductor</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            background: #0f0f0f; 
            color: white;
            overflow: hidden; 
        }

        /* --- TÍTULO MARCOSOFT --- */
        .logo-header {
            padding: 15px;
            background: #181818;
            border-bottom: 1px solid #333;
            text-align: center;
        }
        
        h1 { 
            margin: 0; 
        }

        /* --- DISEÑO PARA ESCRITORIO --- */
        .video-section { 
            flex: 3; 
            background: #000; 
            display: flex; 
            flex-direction: column; /* Para poner el H1 arriba del video */
            height: 100vh;
        }

        .video-container { flex: 1; width: 100%; }

        .sidebar { 
            flex: 1; 
            background: #181818; 
            border-left: 1px solid #333; 
            overflow-y: auto; 
            padding: 20px; 
            height: 100vh;
        }

        h2 { font-size: 1.1rem; margin-top: 0; padding-bottom: 15px; border-bottom: 1px solid #333; color: #aaa; }

        .btn-video { 
            width: 100%; padding: 14px; margin-bottom: 10px; background: #222; border: 1px solid #444;
            color: #efefef; text-align: left; cursor: pointer; border-radius: 8px; transition: all 0.2s ease;
        }
        
        .btn-video:hover { background: #333; border-color: #280463; }
        .btn-video.active { background: #280463; color: white; border-color: #280463; font-weight: bold; }

        /* --- DISEÑO PARA MÓVIL (Responsivo y Fijo) --- */
        @media (max-width: 768px) {
            body { 
                flex-direction: column; 
                overflow-y: auto; 
                height: auto;
            }
            
            .video-section { 
                height: auto; /* Se ajusta al contenido (H1 + Video) */
                width: 100%;
                position: fixed; 
                top: 0;
                left: 0;
                z-index: 999;
            }

            .video-container {
                height: 30vh; /* El video mantiene su tamaño en móvil */
                flex: none;
            }

            .sidebar { 
                flex: none; 
                /* El margen superior ahora debe cubrir el H1 + el Video */
                margin-top: calc(30vh + 60px); 
                width: 100%;
                height: auto;
                padding-bottom: 30px;
                border-left: none;
                overflow-y: visible;
            }
        }
    </style>
</head>
<body>

    <section class="video-section">
        <div class="logo-header">
            <h1>MarcoSoft TV</h1>
        </div>
        <div id="player" class="video-container"></div>
    </section>

    <aside class="sidebar">
        <h2>Canales Disponibles</h2>
        <div id="lista-botones"></div>
    </aside>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>

</body>

</html>
